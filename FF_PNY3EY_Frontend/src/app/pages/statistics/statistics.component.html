<div class="container py-4">
  <h2 class="mb-4">Statisztikák</h2>

  <div class="alert alert-info mb-4 d-flex align-items-center" *ngIf="maxOrder">
    <i class="bi bi-trophy-fill me-2 fs-4"></i>
    <div>
      A hónap legnagyobb rendelése: <strong>{{ maxOrder.name }}</strong> – 
      <span class="fs-5 fw-bold">{{ maxOrder.amount | number:'1.0-0':'hu-HU' }} Ft</span>
    </div>
  </div>

  <div class="row">
    
    <div class="col-md-6 mb-4">
      <div class="card shadow-sm h-100">
        <div class="card-header bg-white">
          <h5 class="card-title mb-0">Rendelések száma havonta</h5>
        </div>
        <div class="card-body">
          <div style="height: 300px;" *ngIf="ordersPerMonthChartData.datasets.length > 0; else loading">
            <canvas baseChart
              [data]="ordersPerMonthChartData"
              [options]="ordersPerMonthChartOptions"
              [type]="'bar'">
            </canvas>
          </div>
        </div>
      </div>
    </div>

    <div class="col-md-6 mb-4">
      <div class="card shadow-sm h-100">
        <div class="card-header bg-white">
          <h5 class="card-title mb-0">Projektek száma a hónapban</h5>
        </div>
        <div class="card-body">
          <div style="height: 300px;" *ngIf="projectCountChartData.datasets.length > 0; else noData">
            <canvas baseChart
              [data]="projectCountChartData"
              [options]="projectCountChartOptions"
              [type]="'doughnut'">
            </canvas>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<ng-template #loading>
  <div class="d-flex justify-content-center align-items-center h-100 text-muted">
    <div class="spinner-border spinner-border-sm me-2"></div> Adatok betöltése...
  </div>
</ng-template>

<ng-template #noData>
  <div class="d-flex justify-content-center align-items-center h-100 text-muted">
    Nincs megjeleníthető adat ebben a hónapban.
  </div>
</ng-template>
